services:
  moontv-core:
    image: registry.cn-hangzhou.aliyuncs.com/pubg/moontvplus:${tag}
    container_name: moontv-core
    restart: on-failure
    ports:
      - '6699:3000'
    environment:
      - USERNAME=admin
      - PASSWORD=MoonTV_Plus_Secure_2026!
      - NEXT_PUBLIC_STORAGE_TYPE=kvrocks
      - KVROCKS_URL=redis://moontv-kvrocks:6666
    volumes:
      - app-data:/app/.data
    networks:
      - moontv-network
    depends_on:
      - moontv-kvrocks
  moontv-kvrocks:
    image: apache/kvrocks
    container_name: moontv-kvrocks
    restart: unless-stopped
    volumes:
      - kvrocks-data:/var/lib/kvrocks
    networks:
      - moontv-network
networks:
  moontv-network:
    driver: bridge
volumes:
  kvrocks-data:
    driver: local
  app-data:
    driver: local
